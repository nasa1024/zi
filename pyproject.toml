[project]
name = "zi"
version = "0.1.0"
description = "NovelForge AI web-fiction writing engine"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136,<1.0",
    "jieba>=0.42,<1.0",
    "langgraph==1.0.8",
    "langgraph-checkpoint-sqlite==3.1.0",
    "pydantic>=2.13,<3.0",
    "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
